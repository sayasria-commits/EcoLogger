services:
  - type: web
    name: ecologger
    runtime: python
    plan: free
    buildCommand: pip install poetry && poetry config virtualenvs.create false && poetry install --no-root
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      
